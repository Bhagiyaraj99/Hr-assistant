name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ --max-line-length=100 --ignore=E501,W503

      - name: Verify all imports resolve
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: docqa-hr-assistant
          LANGSMITH_TRACING: "false"
          CHROMA_DB_PATH: ./chroma_store
          CHROMA_COLLECTION_NAME: hr_policy_docs
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          LLM_MODEL: llama-3.3-70b-versatile
        run: |
          python -c "from app.core.config import settings; print('config OK')"
          python -c "from app.services.ingestion import ingest_pdf; print('ingestion OK')"
          python -c "from app.services.retrieval import hybrid_retrieve; print('retrieval OK')"
          python -c "from app.services.generation import answer_question; print('generation OK')"
          python -c "from app.api.v1.routes import router; print('routes OK')"
          python -c "from app.main import app; print('main OK')"

      - name: Build Docker image
        run: docker build -t hr-assistant:ci .