version: "3.9"

services:
  docqa:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount chroma_store so the vector DB persists between container restarts
      # Without this, every container restart would wipe your ingested documents
      - ./chroma_store:/app/chroma_store
      # Mount data so uploaded PDFs persist too
      - ./data:/app/data